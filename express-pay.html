<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Express Checkout Authentication | Bean Boutique">
  <title>Express Checkout Authentication | Bean Boutique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-cream-dark">

  <!-- Minimal Header -->
  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand text-dark fs-4 font-heading fw-bold">
        <i class="fas fa-seedling text-primary me-2"></i> Bean Boutique
      </a>
      <a href="payment.html" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Return to Checkout
      </a>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div id="express-pay-box" class="card border-0 shadow-lg rounded-4 p-4 text-center bg-white">
            <div class="spinner-border text-primary mx-auto my-4" role="status">
              <span class="visually-hidden">Loading Express Checkout...</span>
            </div>
            <p class="text-muted">Connecting to payment provider...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/search.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      const urlParams = new URLSearchParams(window.location.search);
      const method = urlParams.get('method') || 'Express Pay';
      const $box = $('#express-pay-box');

      let iconClass = 'fa-wallet';
      let brandColor = 'text-primary';
      let methodTitle = method;

      if (method.toLowerCase().includes('apple')) {
        iconClass = 'fa-apple';
        brandColor = 'text-dark';
        methodTitle = 'Apple Pay';
      } else if (method.toLowerCase().includes('google')) {
        iconClass = 'fa-google';
        brandColor = 'text-primary';
        methodTitle = 'Google Pay';
      } else if (method.toLowerCase().includes('paypal')) {
        iconClass = 'fa-paypal';
        brandColor = 'text-info';
        methodTitle = 'PayPal Express';
      }

      const items = window.CartEngine ? window.CartEngine.getItems() : [];
      let total = 0;
      items.forEach(i => {
        const p = parseFloat(i.price.replace(/[^0-9.]/g, '')) || 15;
        total += p * i.qty;
      });
      const grandTotal = total > 0 ? (total * 1.08 + (total > 50 ? 0 : 5.99)).toFixed(2) : "45.98";

      setTimeout(() => {
        $box.html(`
          <div class="mb-3">
            <i class="fab ${iconClass} ${brandColor} display-3"></i>
          </div>
          <h2 class="h4 font-heading fw-bold mb-2">${methodTitle} Authentication</h2>
          <p class="text-muted small mb-4">Confirm your identity to authorize payment of <strong class="text-dark">$${grandTotal}</strong> to Bean Boutique.</p>

          <div class="p-3 bg-light rounded-3 text-start mb-4 border">
            <div class="d-flex justify-content-between mb-1 extra-small text-muted">
              <span>Merchant:</span>
              <strong class="text-dark">Bean Boutique Coffee Co.</strong>
            </div>
            <div class="d-flex justify-content-between mb-1 extra-small text-muted">
              <span>Total Charge:</span>
              <strong class="text-primary">$${grandTotal}</strong>
            </div>
            <div class="d-flex justify-content-between extra-small text-muted">
              <span>Payment Account:</span>
              <strong class="text-dark">•••• 4821 (Verified)</strong>
            </div>
          </div>

          <button id="btn-auth-express" class="btn btn-primary btn-lg w-100 rounded-pill py-3 fw-bold mb-3">
            <i class="fas fa-fingerprint me-2"></i> Authorize &amp; Pay $${grandTotal}
          </button>
          <a href="payment.html" class="btn btn-link text-muted text-decoration-none extra-small">Cancel and choose another method</a>
        `);

        $('#btn-auth-express').on('click', function() {
          const $btn = $(this);
          $btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span> Authenticating Biometrics...');

          setTimeout(() => {
            // Clear cart
            if (window.CartEngine) {
              localStorage.removeItem('bb_cart_items');
              window.CartEngine.updateBadge();
            }

            const orderId = 'BB-EXP-' + Math.floor(100000 + Math.random() * 900000);

            $box.html(`
              <div class="text-success mb-3">
                <i class="fas fa-check-circle display-3"></i>
              </div>
              <h2 class="h4 font-heading fw-bold mb-2">${methodTitle} Payment Approved!</h2>
              <p class="text-muted small mb-4">Your transaction was authorized successfully.</p>
              <div class="badge bg-cream text-dark p-2 fs-6 rounded-pill mb-4 border">
                Order #${orderId}
              </div>
              <a href="index.html" class="btn btn-primary rounded-pill w-100 py-2 fw-bold">Return to Store</a>
            `);
          }, 1500);
        });
      }, 600);
    });
  </script>
</body>
</html>
